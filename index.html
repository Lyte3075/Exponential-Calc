<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Advanced Multi-Tab Calculator</title>
    <!-- Chart.js CDN for Graphing Functionality -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --calc-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --primary-color: #475da7;
            --primary-hover: #35467e;
            --btn-bg: #f1f3f4;
            --btn-hover: #e8eaed;
            --fn-btn-bg: #dadce0;
            --fn-btn-hover: #bdc1c6;
            --accent-bg: #4b8bbd;
        }

        /* Light Mode (default) */
        .theme-light {
            --bg-color: #f8f9fa;
            --calc-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
            --primary-color: #475da7;
            --primary-hover: #35467e;
            --btn-bg: #f1f3f4;
            --btn-hover: #e8eaed;
            --fn-btn-bg: #dadce0;
            --fn-btn-hover: #bdc1c6;
            --accent-bg: #4b8bbd;
        }

        /* Dark Mode */
        .theme-dark {
            --bg-color: #121212;
            --calc-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary-color: #bb86fc;
            --primary-hover: #985eff;
            --btn-bg: #2a2a2a;
            --btn-hover: #3c3c3c;
            --fn-btn-bg: #444444;
            --fn-btn-hover: #5c5c5c;
            --accent-bg: #bb86fc;
        }

        /* Forest Green */
        .theme-forest-green {
            --bg-color: #e6f0e6;
            --calc-bg: #f0fff0;
            --text-color: #2b4d2b;
            --border-color: #a8d5a8;
            --primary-color: #237323;
            --primary-hover: #1a521a;
            --btn-bg: #cce5cc;
            --btn-hover: #b8d0b8;
            --fn-btn-bg: #a3c29a;
            --fn-btn-hover: #8aa781;
            --accent-bg: #237323;
        }

        /* Sunset */
        .theme-sunset {
            --bg-color: #fff4f1;
            --calc-bg: #fffafa;
            --text-color: #804000;
            --border-color: #fdc3b3;
            --primary-color: #ff5722;
            --primary-hover: #e64a19;
            --btn-bg: #ffd3c6;
            --btn-hover: #ffbca1;
            --fn-btn-bg: #ff8a65;
            --fn-btn-hover: #e57373;
            --accent-bg: #ff5722;
        }

        /* Stone Gray */
        .theme-stone-gray {
            --bg-color: #f4f4f4;
            --calc-bg: #e0e0e0;
            --text-color: #4a4a4a;
            --border-color: #bfbfbf;
            --primary-color: #737373;
            --primary-hover: #595959;
            --btn-bg: #cfcfcf;
            --btn-hover: #b0b0b0;
            --fn-btn-bg: #9e9e9e;
            --fn-btn-hover: #7d7d7d;
            --accent-bg: #737373;
        }

        /* High Contrast */
        .theme-high-contrast {
            --bg-color: #000000;
            --calc-bg: #000000;
            --text-color: #ff0000;
            --border-color: #ffff00;
            --primary-color: #00ffff;
            --primary-hover: #00dddd;
            --btn-bg: #0000ff;
            --btn-hover: #222222;
            --fn-btn-bg: #ffff00;
            --fn-btn-hover: #dddd00;
            --accent-bg: #00ffff;
        }

        /* Lego Bricks */
        .theme-lego-bricks {
            --bg-color: #fce205;
            --calc-bg: #f0f0f0;
            --text-color: #191919;
            --border-color: #cc0000;
            --primary-color: #cc0000;
            --primary-hover: #990000;
            --btn-bg: #ffcc00;
            --btn-hover: #e6b800;
            --fn-btn-bg: #cc0000;
            --fn-btn-hover: #990000;
            --accent-bg: #cc0000;
        }

        /* Frutiger Aero */
        .theme-frutiger-aero {
            --bg-color: #e9f0f4;
            --calc-bg: #ffffff;
            --text-color: #2d3e50;
            --border-color: #a7bbc7;
            --primary-color: #3a97d1;
            --primary-hover: #2d7bb3;
            --btn-bg: #d4e4f1;
            --btn-hover: #b8cee1;
            --fn-btn-bg: #8eb9dc;
            --fn-btn-hover: #6ea0c9;
            --accent-bg: #3a97d1;
        }

        /* Space */
        .theme-space {
            --bg-color: #000011;
            --calc-bg: #111122;
            --text-color: #aaccee;
            --border-color: #334455;
            --primary-color: #66aaff;
            --primary-hover: #5599ee;
            --btn-bg: #223344;
            --btn-hover: #2a3f5f;
            --fn-btn-bg: #445577;
            --fn-btn-hover: #5588aa;
            --accent-bg: #66aaff;
        }

        /* Cyberpunk */
        .theme-cyberpunk {
            --bg-color: #220022;
            --calc-bg: #2c002c;
            --text-color: #ff55ff;
            --border-color: #ff00ff;
            --primary-color: #ff33cc;
            --primary-hover: #ff00aa;
            --btn-bg: #440044;
            --btn-hover: #661166;
            --fn-btn-bg: #aa00aa;
            --fn-btn-hover: #cc00cc;
            --accent-bg: #ff33cc;
        }

        /* Common Reset and Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--calc-bg);
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Settings bar */
        .settings-bar {
            display: flex;
            justify-content: flex-end;
            padding: 12px 15px;
            background: var(--btn-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .settings-bar label {
            font-weight: 600;
            margin-right: 10px;
            color: var(--text-color);
            user-select: none;
        }

        .settings-bar select {
            padding: 7px 10px;
            font-size: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--calc-bg);
            color: var(--text-color);
            outline: none;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .settings-bar select:hover, .settings-bar select:focus {
            background-color: var(--btn-hover);
        }

        /* Tabs Navigation */
        .tabs {
            display: flex;
            background: #ededed;
            border-bottom: 2px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: #5f6368;
            transition: all 0.2s ease;
            text-align: center;
        }

        .tab-btn:hover {
            background: #e4e4e4;
            color: #202124;
        }

        .tab-btn.active {
            background: var(--calc-bg);
            color: var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            margin-bottom: -2px;
        }

        /* Tab Content Panel */
        .tab-content {
            display: none;
            padding: 25px;
        }

        .tab-content.active {
            display: block;
        }

        /* Displays */
        .display-container {
            position: relative;
            margin-bottom: 20px;
        }

        .calc-display {
            width: 100%;
            height: 70px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #fcfcfc;
            padding: 10px 15px;
            font-size: 28px;
            text-align: right;
            outline: none;
            color: var(--text-color);
            background-color: var(--calc-bg);
        }

        .history-display {
            font-size: 14px;
            color: #70757a;
            position: absolute;
            top: 5px;
            right: 15px;
            height: 20px;
            user-select: none;
        }

        /* Keypad Layouts */
        .grid-4func {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .grid-sci {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        /* Buttons styling */
        button.btn {
            padding: 18px 10px;
            font-size: 18px;
            font-weight: 500;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            background-color: var(--btn-bg);
            color: var(--text-color);
            transition: background 0.1s;
            user-select: none;
        }

        button.btn:hover {
            background-color: var(--btn-hover);
        }

        button.btn-op {
            background-color: var(--fn-btn-bg);
            font-weight: 600;
        }

        button.btn-op:hover {
            background-color: var(--fn-btn-hover);
        }

        button.btn-action {
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
        }

        button.btn-action:hover {
            background-color: var(--primary-hover);
        }

        /* Graphing Tab Layout */
        .graph-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }

        @media (max-width: 700px) {
            .graph-layout {
                grid-template-columns: 1fr;
            }
        }

        .graph-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }

        .input-group input, .input-group select {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            color: var(--text-color);
            background: var(--calc-bg);
        }

        .graph-container {
            position: relative;
            width: 100%;
            height: 350px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
        }

        /* Unit Converter Layout */
        .converter-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .converter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

    </style>
</head>
<body class="theme-light">

    <div class="container">
        <!-- Settings bar -->
        <div class="settings-bar">
            <label for="theme-select">Theme:</label>
            <select id="theme-select" onchange="changeTheme(this.value)" aria-label="Select theme">
                <option value="theme-light" selected>Light Mode</option>
                <option value="theme-dark">Dark Mode</option>
                <option value="theme-forest-green">Forest Green</option>
                <option value="theme-sunset">Sunset</option>
                <option value="theme-stone-gray">Stone Gray</option>
                <option value="theme-high-contrast">High Contrast</option>
                <option value="theme-lego-bricks">Lego Bricks</option>
                <option value="theme-frutiger-aero">Frutiger Aero</option>
                <option value="theme-space">Space</option>
                <option value="theme-cyberpunk">Cyberpunk</option>
            </select>
        </div>

        <!-- Tabs Bar -->
        <nav class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'four-function')">4-Function</button>
            <button class="tab-btn" onclick="switchTab(event, 'scientific')">Scientific</button>
            <button class="tab-btn" onclick="switchTab(event, 'graphing')">Graphing</button>
            <button class="tab-btn" onclick="switchTab(event, 'unit-conversion')">Unit Converter</button>
        </nav>

        <!-- 1. Four Function Tab -->
        <section id="four-function" class="tab-content active">
            <div class="display-container">
                <div id="ff-history" class="history-display"></div>
                <input type="text" id="ff-display" class="calc-display" readonly value="0" />
            </div>
            <div class="grid-4func">
                <button class="btn btn-op" onclick="clearDisplay('ff')">C</button>
                <button class="btn btn-op" onclick="inputOp('ff', '/')">÷</button>
                <button class="btn btn-op" onclick="inputOp('ff', '*')">×</button>
                <button class="btn btn-op" onclick="backspace('ff')">⌫</button>

                <button class="btn" onclick="inputNum('ff', '7')">7</button>
                <button class="btn" onclick="inputNum('ff', '8')">8</button>
                <button class="btn" onclick="inputNum('ff', '9')">9</button>
                <button class="btn btn-op" onclick="inputOp('ff', '-')">-</button>

                <button class="btn" onclick="inputNum('ff', '4')">4</button>
                <button class="btn" onclick="inputNum('ff', '5')">5</button>
                <button class="btn" onclick="inputNum('ff', '6')">6</button>
                <button class="btn btn-op" onclick="inputOp('ff', '+')">+</button>

                <button class="btn" onclick="inputNum('ff', '1')">1</button>
                <button class="btn" onclick="inputNum('ff', '2')">2</button>
                <button class="btn" onclick="inputNum('ff', '3')">3</button>
                <button class="btn btn-action" style="grid-row: span 2; height: 100%;" onclick="calculate('ff')">=</button>

                <button class="btn" style="grid-column: span 2;" onclick="inputNum('ff', '0')">0</button>
                <button class="btn" onclick="inputNum('ff', '.')">.</button>
            </div>
        </section>

        <!-- 2. Scientific Tab -->
        <section id="scientific" class="tab-content">
            <div class="display-container">
                <div id="sci-history" class="history-display"></div>
                <input type="text" id="sci-display" class="calc-display" readonly value="0" />
            </div>
            <div class="grid-sci">
                <button class="btn btn-op" onclick="inputSciFn('sin')">sin</button>
                <button class="btn btn-op" onclick="inputSciFn('cos')">cos</button>
                <button class="btn btn-op" onclick="inputSciFn('tan')">tan</button>
                <button class="btn btn-op" onclick="clearDisplay('sci')">C</button>
                <button class="btn btn-op" onclick="backspace('sci')">⌫</button>

                <button class="btn btn-op" onclick="inputSciFn('ln')">ln</button>
                <button class="btn btn-op" onclick="inputSciFn('log')">log</button>
                <button class="btn btn-op" onclick="inputSciFn('sqrt')">√</button>
                <button class="btn btn-op" onclick="inputOp('sci', '^')">^</button>
                <button class="btn btn-op" onclick="inputOp('sci', '/')">÷</button>

                <button class="btn btn-op" onclick="inputSciFn('pi')">π</button>
                <button class="btn" onclick="inputNum('sci', '7')">7</button>
                <button class="btn" onclick="inputNum('sci', '8')">8</button>
                <button class="btn" onclick="inputNum('sci', '9')">9</button>
                <button class="btn btn-op" onclick="inputOp('sci', '*')">×</button>

                <button class="btn btn-op" onclick="inputSciFn('e')">e</button>
                <button class="btn" onclick="inputNum('sci', '4')">4</button>
                <button class="btn" onclick="inputNum('sci', '5')">5</button>
                <button class="btn" onclick="inputNum('sci', '6')">6</button>
                <button class="btn btn-op" onclick="inputOp('sci', '-')">-</button>

                <button class="btn btn-op" onclick="inputNum('sci', '(')">(</button>
                <button class="btn" onclick="inputNum('sci', '1')">1</button>
                <button class="btn" onclick="inputNum('sci', '2')">2</button>
                <button class="btn" onclick="inputNum('sci', '3')">3</button>
                <button class="btn btn-op" onclick="inputOp('sci', '+')">+</button>

                <button class="btn btn-op" onclick="inputNum('sci', ')')">)</button>
                <button class="btn" style="grid-column: span 2;" onclick="inputNum('sci', '0')">0</button>
                <button class="btn" onclick="inputNum('sci', '.')">.</button>
                <button class="btn btn-action" onclick="calculate('sci')">=</button>
            </div>
        </section>

        <!-- 3. Graphing Tab -->
        <section id="graphing" class="tab-content">
            <div class="graph-layout">
                <div class="graph-controls">
                    <div class="input-group">
                        <label for="graph-eq">Equation: y =</label>
                        <input type="text" id="graph-eq" value="x^2" placeholder="e.g., x^2, sin(x), 2*x + 3" />
                    </div>
                    <div class="input-group">
                        <label for="graph-range">X Range:</label>
                        <select id="graph-range" onchange="plotGraph()">
                            <option value="10">-10 to 10</option>
                            <option value="20">-20 to 20</option>
                            <option value="5">-5 to 5</option>
                        </select>
                    </div>
                    <button class="btn btn-action" style="padding:12px;" onclick="plotGraph()">Plot Graph</button>
                </div>
                <div class="graph-container">
                    <canvas id="graphCanvas"></canvas>
                </div>
            </div>
        </section>

        <!-- 4. Unit Conversion Tab -->
        <section id="unit-conversion" class="tab-content">
            <div class="converter-layout">
                <div class="input-group">
                    <label for="convert-type">Measurement Category</label>
                    <select id="convert-type" onchange="updateUnitOptions()">
                        <option value="length">Length</option>
                        <option value="weight">Weight / Mass</option>
                        <option value="temp">Temperature</option>
                    </select>
                </div>
                
                <div class="converter-row">
                    <div class="input-group">
                        <label for="convert-from-value">From</label>
                        <input type="number" id="convert-from-value" value="1" oninput="performConversion()" />
                        <select id="convert-from-unit" style="margin-top:8px;" onchange="performConversion()"></select>
                    </div>
                    
                    <div class="input-group">
                        <label for="convert-to-value">To</label>
                        <input type="number" id="convert-to-value" readonly value="0" />
                        <select id="convert-to-unit" style="margin-top:8px;" onchange="performConversion()"></select>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        // --- Core Tab Switching ---
        function switchTab(evt, tabId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));
            
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => tab.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');

            if (tabId === 'graphing' && !chartInstance) {
                // Delay initialization slightly to ensure canvas layout renders properly
                setTimeout(plotGraph, 50);
            }
        }

        // --- Standard & Scientific Calculation State Engine ---
        let state = {
            ff: { display: '0', history: '', resetOnNext: false },
            sci: { display: '0', history: '', resetOnNext: false }
        };

        function updateUI(prefix) {
            document.getElementById(`${prefix}-display`).value = state[prefix].display;
            document.getElementById(`${prefix}-history`).innerText = state[prefix].history;
        }

        function inputNum(prefix, token) {
            if (state[prefix].display === '0' || state[prefix].resetOnNext) {
                state[prefix].display = token;
                state[prefix].resetOnNext = false;
            } else {
                state[prefix].display += token;
            }
            updateUI(prefix);
        }

        function inputOp(prefix, op) {
            if (state[prefix].resetOnNext) state[prefix].resetOnNext = false;
            
            const current = state[prefix].display;
            const lastChar = current.trim().slice(-1);
            
            if (['+', '-', '*', '/', '^'].includes(lastChar)) {
                state[prefix].display = current.slice(0, -1) + op;
            } else {
                state[prefix].display += op;
            }
            updateUI(prefix);
        }

        function inputSciFn(fn) {
            if (state.sci.display === '0' || state.sci.resetOnNext) {
                state.sci.display = fn + '(';
                state.sci.resetOnNext = false;
            } else {
                state.sci.display += fn + '(';
            }
            updateUI('sci');
        }

        function clearDisplay(prefix) {
            state[prefix].display = '0';
            state[prefix].history = '';
            updateUI(prefix);
        }

        function backspace(prefix) {
            let current = state[prefix].display;
            if (current.length > 1) {
                state[prefix].display = current.slice(0, -1);
            } else {
                state[prefix].display = '0';
            }
            updateUI(prefix);
        }

        function safeEval(rawExpression) {
            // Replaces presentation operators with JavaScript safe match operators
            let prepared = rawExpression
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/π/g, 'Math.PI')
                .replace(/e/g, 'Math.E')
                .replace(/sin\(/g, 'Math.sin(')
                .replace(/cos\(/g, 'Math.cos(')
                .replace(/tan\(/g, 'Math.tan(')
                .replace(/log\(/g, 'Math.log10(')
                .replace(/ln\(/g, 'Math.log(')
                .replace(/sqrt\(/g, 'Math.sqrt(');

            // Handle power exponent tracking matching standard structural notation (x^y)
            while (prepared.includes('^')) {
                prepared = prepared.replace(/([0-9.]+|Math\.PI|Math\.E|\([^)]+\))\^([0-9.]+|Math\.PI|Math\.E|\([^)]+\))/g, 'Math.pow($1,$2)');
            }

            const result = new Function(`return ${prepared}`)();
            if (isNaN(result) || !isFinite(result)) throw new Error("Invalid Output");
            return Number(result.toFixed(8)); // Prevents floating-point expansion artifacts
        }

        function calculate(prefix) {
            try {
                const expr = state[prefix].display;
                const result = safeEval(expr);
                state[prefix].history = expr + ' =';
                state[prefix].display = String(result);
                state[prefix].resetOnNext = true;
            } catch (err) {
                state[prefix].display = 'Error';
                state[prefix].resetOnNext = true;
            }
            updateUI(prefix);
        }


        // --- Graphing Architecture (Chart.js) ---
        let chartInstance = null;

        function parseGraphExpr(expr, xVal) {
            let prepared = expr
                .replace(/x/g, `(${xVal})`)
                .replace(/sin/g, 'Math.sin')
                .replace(/cos/g, 'Math.cos')
                .replace(/tan/g, 'Math.tan')
                .replace(/log/g, 'Math.log10')
                .replace(/ln/g, 'Math.log')
                .replace(/sqrt/g, 'Math.sqrt')
                .replace(/PI/g, 'Math.PI')
                .replace(/E/g, 'Math.E');

            while (prepared.includes('^')) {
                prepared = prepared.replace(/([0-9.x()\-+*/]+)\^([0-9.x()\-+*/]+)/g, 'Math.pow($1,$2)');
            }
            return new Function(`return ${prepared}`)();
        }

        function plotGraph() {
            const formula = document.getElementById('graph-eq').value;
            const rangeLimit = parseFloat(document.getElementById('graph-range').value);
            
            const xData = [];
            const yData = [];
            
            const step = rangeLimit / 50; 
            for (let x = -rangeLimit; x <= rangeLimit; x += step) {
                try {
                    const y = parseGraphExpr(formula, x);
                    if (isFinite(y) && !isNaN(y)) {
                        xData.push(Number(x.toFixed(2)));
                        yData.push(y);
                    } else {
                        // Skip invalid points by pushing null for gaps in graph
                        xData.push(Number(x.toFixed(2)));
                        yData.push(null);
                    }
                } catch (e) {
                    xData.push(Number(x.toFixed(2)));
                    yData.push(null);
                }
            }

            const ctx = document.getElementById('graphCanvas').getContext('2d');
            
            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: xData,
                    datasets: [{
                        label: `y = ${formula}`,
                        data: yData,
                        borderColor: getComputedStyle(document.body).getPropertyValue('--primary-color').trim() || '#475da7',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            min: -rangeLimit,
                            max: rangeLimit,
                            title: {
                                display: true,
                                text: 'X'
                            }
                        },
                        y: {
                            type: 'linear',
                            position: 'left',
                            title: {
                                display: true,
                                text: 'Y'
                            }
                        }
                    },
                    plugins: {
                        legend: { display: true }
                    }
                }
            });
        }


        // --- Unit Converter Architecture ---
        const unitData = {
            length: {
                meters: 1,
                kilometers: 0.001,
                centimeters: 100,
                inches: 39.3701,
                feet: 3.28084
            },
            weight: {
                kilograms: 1,
                grams: 1000,
                pounds: 2.20462,
                ounces: 35.274
            },
            temp: 'SPECIAL_CASE' 
        };

        function updateUnitOptions() {
            const category = document.getElementById('convert-type').value;
            const fromSelect = document.getElementById('convert-from-unit');
            const toSelect = document.getElementById('convert-to-unit');
            
            fromSelect.innerHTML = '';
            toSelect.innerHTML = '';

            if (category === 'temp') {
                const options = ['Celsius', 'Fahrenheit', 'Kelvin'];
                options.forEach(opt => {
                    fromSelect.add(new Option(opt, opt));
                    toSelect.add(new Option(opt, opt));
                });
            } else {
                const options = Object.keys(unitData[category]);
                options.forEach(opt => {
                    fromSelect.add(new Option(opt, opt));
                    toSelect.add(new Option(opt, opt));
                });
            }
            // Defaults mismatch optimization
            if(toSelect.options.length > 1) toSelect.selectedIndex = 1;

            performConversion();
        }

        function performConversion() {
            const category = document.getElementById('convert-type').value;
            const valFrom = parseFloat(document.getElementById('convert-from-value').value);
            const unitFrom = document.getElementById('convert-from-unit').value;
            const unitTo = document.getElementById('convert-to-unit').value;
            const targetInput = document.getElementById('convert-to-value');

            if (isNaN(valFrom)) {
                targetInput.value = '';
                return;
            }

            if (unitFrom === unitTo) {
                targetInput.value = valFrom;
                return;
            }

            if (category === 'temp') {
                let baseCelsius = 0;
                if (unitFrom === 'Celsius') baseCelsius = valFrom;
                else if (unitFrom === 'Fahrenheit') baseCelsius = (valFrom - 32) * 5/9;
                else if (unitFrom === 'Kelvin') baseCelsius = valFrom - 273.15;

                let outVal = 0;
                if (unitTo === 'Celsius') outVal = baseCelsius;
                else if (unitTo === 'Fahrenheit') outVal = (baseCelsius * 9/5) + 32;
                else if (unitTo === 'Kelvin') outVal = baseCelsius + 273.15;
                
                targetInput.value = Number(outVal.toFixed(4));
            } else {
                const rates = unitData[category];
                const valueInBase = valFrom / rates[unitFrom]; 
                const convertedValue = valueInBase * rates[unitTo]; 
                targetInput.value = Number(convertedValue.toFixed(6));
            }
        }

        // Theme switching
        function changeTheme(themeClass) {
            document.body.className = themeClass;
            localStorage.setItem('selectedTheme', themeClass);
        }

        // Initialize runtime modules on document load
        window.onload = () => {
            updateUnitOptions();

            // Apply saved theme if any
            const savedTheme = localStorage.getItem('selectedTheme');
            if (savedTheme) {
                document.body.className = savedTheme;
                const select = document.getElementById('theme-select');
                if (select) select.value = savedTheme;
            }
        };
    </script>
</body>
</html>
